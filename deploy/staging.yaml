# OpenMulti - deploiement staging dans son namespace DEDIE `openmulti-staging`
# (co-localise sur le cluster MyMULTI mais isole de multi-staging).
#
# Livraison continue: la CI (.github/workflows/ci.yml) build+push l'image sur GHCR
# (ghcr.io/multi-foundation/openmulti) puis le job `deploy` fait set-image au sha +
# rollout via un ServiceAccount scope a `openmulti-staging` (secret STAGING_KUBECONFIG).
# Ce SA ne peut PAS toucher multi-staging ni la prod (Role namespace, verifie).
#
# ⚠️ La CI fait UNIQUEMENT `set image` — elle ne re-applique JAMAIS ce manifeste (le SA
# scope n'a pas les droits sur Service/NetworkPolicy/RBAC). Tout changement ici (env,
# securityContext, NetworkPolicy...) doit etre applique MANUELLEMENT par un admin:
# `kubectl apply -f deploy/staging.yaml` (repasse l'image a :latest -> re-pinner au sha)
# ou un `kubectl patch` chirurgical. Cf docs/OBSERVABILITY-SETUP.md (etape 2).
#
# Bootstrap one-shot (deja fait, secrets crees hors manifeste pour ne pas versionner
# de valeurs):
#   kubectl create namespace openmulti-staging
#   # OpenMulti a SA PROPRE cle OpenRouter (independance) + le token d'API:
#   kubectl -n openmulti-staging create secret generic openmulti-secrets \
#     --from-literal=OPENMULTI_API_KEYS=sk_om_staging_xxx \
#     --from-literal=OPENROUTER_API_KEY=sk-or-xxx
#   # pull secret GHCR (copie depuis multi-staging, a acces aux packages de l'org):
#   kubectl -n openmulti-staging create secret ... ghcr-credentials (dockerconfigjson)
#   kubectl apply -f deploy/staging.yaml
#   # cote MyMULTI staging, activer le flag + pointer le service du ns dedie:
#   kubectl set env deployment/multi-app -n multi-staging \
#     OPENMULTI_ENABLED=true \
#     OPENMULTI_BASE_URL=http://openmulti.openmulti-staging.svc.cluster.local:8080/v1 \
#     OPENMULTI_API_KEY=<le meme token qu'OPENMULTI_API_KEYS>
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: openmulti, namespace: openmulti-staging, labels: { app: openmulti } }
spec:
  replicas: 1
  selector: { matchLabels: { app: openmulti } }
  template:
    metadata: { labels: { app: openmulti } }
    spec:
      imagePullSecrets: [{ name: ghcr-credentials }]
      containers:
        - name: openmulti
          image: ghcr.io/multi-foundation/openmulti:latest
          imagePullPolicy: Always  # CI set l'image au sha exact a chaque deploy
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: openmulti-secrets, key: OPENROUTER_API_KEY } }
            - name: OPENMULTI_API_KEYS
              valueFrom: { secretKeyRef: { name: openmulti-secrets, key: OPENMULTI_API_KEYS } }
            - name: OPENMULTI_REFERER
              value: "https://staging.mymulti.ai"
            - name: OPENMULTI_TITLE
              value: "OpenMulti (staging)"
            # OM-03: token ops dedie pour /metrics. `optional: true` -> tant que la cle
            # n'existe pas dans le secret, la var reste vide et /metrics retombe sur
            # l'auth appelante (zero regression). Ajouter la cle au secret pour l'activer.
            - name: OPENMULTI_METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: openmulti-secrets, key: OPENMULTI_METRICS_TOKEN, optional: true } }
            # OM-02: limite de taille de corps (filet, large au-dessus du trafic reel).
            - name: OPENMULTI_MAX_BODY_BYTES
              value: "8388608"
            # OM-01: rate-limit + plafonds max_tokens/tier. Laisses OFF tant que le profil
            # de trafic MyMULTI n'est pas connu (eviter de throttler du trafic legitime).
            # - name: OPENMULTI_RATE_LIMIT_PER_MIN
            #   value: "600"
            # - name: OPENMULTI_MAX_TOKENS_BALANCED
            #   value: "32000"
            # Metering durable (facturation par cle, cf docs/PRODUCT-V1.md) — Valkey du
            # meme namespace. Retirer la var pour desactiver (no-op cote app).
            - name: REDIS_URL
              value: "redis://valkey:6379"
            # Bandit actif par defaut en STAGING (active le 2026-06-11 pour observer la
            # curation en reel ; un appelant peut toujours forcer openmulti.route).
            # En prod, demarrer sans (iso) et l'activer apres observation.
            - name: OPENMULTI_DEFAULT_ROUTE
              value: "smart"
            # Catalogue local (la correspondance tier->modeles, configuration
            # d'exploitation NON versionnee). La ConfigMap est creee HORS manifeste :
            #   kubectl -n openmulti-staging create configmap openmulti-catalog \
            #     --from-file=catalog.json=catalog.local.json
            # Volume optional: sans ConfigMap, le fichier est absent et l'app retombe
            # sur env/defauts (zero regression). Mise a jour = recreer la ConfigMap
            # + rollout restart (lecture au boot) ; l'ajustement a chaud passe par
            # PUT /admin/catalog (qui prime sur le fichier).
            - name: OPENMULTI_CATALOG_FILE
              value: "/etc/openmulti/catalog.json"
          volumeMounts:
            - name: catalog
              mountPath: /etc/openmulti
              readOnly: true
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 30 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000  # user `node` de l'image alpine; numerique pour runAsNonRoot
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: catalog
          configMap:
            name: openmulti-catalog
            optional: true  # absente = pas de fichier, l'app retombe sur env/defauts
---
apiVersion: v1
kind: Service
metadata: { name: openmulti, namespace: openmulti-staging }
spec:
  type: ClusterIP
  selector: { app: openmulti }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# default-deny (ingress+egress) sur le namespace dedie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: openmulti-staging }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
# Ingress: depuis le ns multi-staging, pods multi-app, port 8080 (cross-namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-mymulti, namespace: openmulti-staging }
spec:
  podSelector: { matchLabels: { app: openmulti } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: multi-staging } }
          podSelector: { matchLabels: { app: multi-app } }
      ports: [{ port: 8080, protocol: TCP }]
---
# Exposition publique (api-staging.openmulti.ai) : Traefik (kube-system) doit pouvoir
# joindre openmulti — le namespace est default-deny. Activee apres le gate OM-06/07
# (audit 9/10, 2026-06-11). L'auth Bearer reste obligatoire sur /v1/* et /admin/*.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-traefik, namespace: openmulti-staging }
spec:
  podSelector: { matchLabels: { app: openmulti } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8080, protocol: TCP }]
---
# Le namespace etant default-deny, les pods solver ACME que cert-manager cree ici
# pour le challenge HTTP-01 doivent aussi etre joignables par Traefik (sinon : 502
# sur le challenge et certificat jamais emis — appris en posant le premier cert).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-acme-solver, namespace: openmulti-staging }
spec:
  podSelector: { matchLabels: { acme.cert-manager.io/http01-solver: "true" } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8089, protocol: TCP }]
---
# HTTPS public : cert Let's Encrypt auto (cert-manager, ClusterIssuer letsencrypt-prod,
# meme pattern que staging.mymulti.ai). Entrypoint websecure uniquement (pas de HTTP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmulti-api
  namespace: openmulti-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api-staging.openmulti.ai
      http:
        paths:
          - backend:
              service: { name: openmulti, port: { number: 8080 } }
            path: /
            pathType: Prefix
  tls:
    - hosts: [api-staging.openmulti.ai]
      secretName: api-staging-openmulti-ai-tls
---
# Egress: DNS + HTTPS (OpenRouter, providers directs) + Valkey (metering durable).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-egress, namespace: openmulti-staging }
spec:
  podSelector: { matchLabels: { app: openmulti } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: {} }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app: valkey } } }]
      ports: [{ port: 6379, protocol: TCP }]
---
# ── Valkey (metering durable par cle, docs/PRODUCT-V1.md) ──────────────────────
# Fork Redis (Linux Foundation, BSD), protocole identique. Mono-pod + PVC local-path
# (comme Prometheus), AOF everysec : perte max ~1s en cas de crash, acceptable pour
# des compteurs d'usage. Recreate: le PVC est RWO.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: valkey-data, namespace: openmulti-staging }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: valkey, namespace: openmulti-staging, labels: { app: valkey } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          # Epingle par digest (meme regle qu'OM-09 ; tag lisible: valkey/valkey:8-alpine)
          image: valkey/valkey:8-alpine@sha256:77643d152547b446fc15cbafaff22004545663fcd40c6b28038ad283837baa75
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 2, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 5, periodSeconds: 30 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # user `valkey` de l'image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: valkey-data }
---
apiVersion: v1
kind: Service
metadata: { name: valkey, namespace: openmulti-staging }
spec:
  type: ClusterIP
  selector: { app: valkey }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
# Valkey n'accepte que les pods openmulti du namespace (default-deny sinon).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-openmulti-to-valkey, namespace: openmulti-staging }
spec:
  podSelector: { matchLabels: { app: valkey } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: openmulti } } }]
      ports: [{ port: 6379, protocol: TCP }]
---
# ServiceAccount de deploiement, scope au seul namespace openmulti-staging.
apiVersion: v1
kind: ServiceAccount
metadata: { name: gh-deployer, namespace: openmulti-staging }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: gh-deployer, namespace: openmulti-staging }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: gh-deployer, namespace: openmulti-staging }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: gh-deployer }
subjects: [{ kind: ServiceAccount, name: gh-deployer, namespace: openmulti-staging }]
---
# Cote MyMULTI (ns multi-staging): autorise l'egress de multi-app vers le ns
# openmulti-staging sur 8080. A appliquer avec des creds admin (le SA gh-deployer
# n'a pas acces a multi-staging). Documente ici pour la reproductibilite.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-app-to-openmulti, namespace: multi-staging }
spec:
  podSelector: { matchLabels: { app: multi-app } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openmulti-staging } } }]
      ports: [{ port: 8080, protocol: TCP }]
