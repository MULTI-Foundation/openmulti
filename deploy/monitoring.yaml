# Stack de monitoring LEGER pour openmulti-staging : Prometheus (scrape /metrics avec le
# token ops) + Grafana (datasource + dashboard provisionnes). Mono-pod, emptyDir (donnees
# ephemeres, OK pour staging), acces par port-forward (pas d'ingress).
#
# Bootstrap (secrets crees hors manifeste pour ne pas versionner de valeurs) :
#   TOK=$(kubectl -n openmulti-staging get secret openmulti-secrets \
#          -o jsonpath='{.data.OPENMULTI_METRICS_TOKEN}' | base64 -d)
#   kubectl create ns monitoring
#   kubectl -n monitoring create secret generic openmulti-scrape --from-literal=token="$TOK"
#   kubectl -n monitoring create secret generic grafana-admin \
#          --from-literal=password="$(openssl rand -hex 16)"
#   kubectl apply -f deploy/monitoring.yaml
# Acces :
#   kubectl -n monitoring port-forward svc/grafana 3000:3000   # http://127.0.0.1:3000 (admin / <secret>)
#   kubectl -n monitoring port-forward svc/prometheus 9090:9090
---
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: monitoring }
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: openmulti
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /etc/scrape/token
        static_configs:
          - targets: ["openmulti.openmulti-staging.svc.cluster.local:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring, labels: { app: prometheus } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
          ports: [{ containerPort: 9090, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
            - { name: scrape-token, mountPath: /etc/scrape, readOnly: true }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
        - name: scrape-token
          secret: { secretName: openmulti-scrape, items: [{ key: token, path: token }] }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: monitoring }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: openmulti
        type: file
        options: { path: /etc/dashboards }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards, namespace: monitoring }
data:
  openmulti.json: |
    {
      "uid": "openmulti", "title": "OpenMulti", "schemaVersion": 39, "version": 1,
      "time": { "from": "now-6h", "to": "now" }, "refresh": "30s",
      "panels": [
        { "id": 1, "title": "Requests/s par modèle", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "sum by (model) (rate(openmulti_requests_total[5m]))", "legendFormat": "{{model}}" } ] },
        { "id": 2, "title": "Taux d'erreur (global)", "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [ { "expr": "sum(rate(openmulti_request_errors_total[5m])) / clamp_min(sum(rate(openmulti_requests_total[5m])), 1)" } ] },
        { "id": 3, "title": "Coût $/h par projet", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [ { "expr": "sum by (key) (rate(openmulti_cost_usd_total[1h])) * 3600", "legendFormat": "{{key}}" } ] },
        { "id": 4, "title": "Latence moyenne (ms) par modèle", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [ { "expr": "sum by (model) (rate(openmulti_request_duration_ms_sum[5m])) / clamp_min(sum by (model) (rate(openmulti_request_duration_ms_count[5m])), 1)", "legendFormat": "{{model}}" } ] }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports: [{ containerPort: 3000, name: http }]
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-dash, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /etc/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      volumes:
        - name: provisioning-ds
          configMap: { name: grafana-provisioning, items: [{ key: datasource.yaml, path: datasource.yaml }] }
        - name: provisioning-dash
          configMap: { name: grafana-provisioning, items: [{ key: provider.yaml, path: provider.yaml }] }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
# openmulti-staging est default-deny ingress -> autoriser le pod Prometheus a scraper :8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-monitoring, namespace: openmulti-staging }
spec:
  podSelector: { matchLabels: { app: openmulti } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports: [{ port: 8080, protocol: TCP }]
