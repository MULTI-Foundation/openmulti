name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # Les actions (checkout@v4, docker/*, azure/setup-kubectl@v4) tournent encore sur Node 20,
  # forcees en Node 24 le 2026-06-16. On opte maintenant pour valider la compat en avance.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Typecheck + contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-push:
    name: Build + push + sign image (GHCR)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # OM-09 : signature cosign keyless (OIDC GitHub)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=,suffix=
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, par digest)
        run: |
          IMG=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMG}@${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to staging (k3s openmulti-staging)
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig (scoped SA, openmulti-staging only)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Roll out new image
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}
          kubectl -n openmulti-staging set image deployment/openmulti openmulti=$IMG
          kubectl -n openmulti-staging rollout status deployment/openmulti --timeout=180s

  deploy-prod:
    name: Deploy to prod (k3s openmulti-prod, sur tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig (scoped SA, openmulti-prod only)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PROD_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Roll out new image
        # L'image du commit taggue a deja ete buildee/poussee/signee a son push sur main.
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}
          kubectl -n openmulti-prod set image deployment/openmulti openmulti=$IMG
          kubectl -n openmulti-prod rollout status deployment/openmulti --timeout=180s
